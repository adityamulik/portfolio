[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/evidence"
  to = "/recognition/"
  status = 301

[[redirects]]
  from = "/evidence/"
  to = "/recognition/"
  status = 301

[[redirects]]
  from = "/evidence/*"
  to = "/recognition/:splat"
  status = 301
